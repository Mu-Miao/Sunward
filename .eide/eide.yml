        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - Drivers/CMSIS/Include
        - Middlewares/Third_Party/FreeRTOS-Kernel/include
        - Middlewares/Third_Party/FreeRTOS-Kernel/portable/GCC/ARM_CM3
      libList: []
    excludeList:
