      files:
        - path: Middlewares/Third_Party/FreeRTOS-Kernel/list.c
        - path: Middlewares/Third_Party/FreeRTOS-Kernel/queue.c
        - path: Middlewares/Third_Party/FreeRTOS-Kernel/tasks.c
        - path: Middlewares/Third_Party/FreeRTOS-Kernel/portable/GCC/ARM_CM3/port.c
        - path: Middlewares/Third_Party/FreeRTOS-Kernel/portable/MemMang/heap_4.c
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 302ad42c8e6d96bf4b506eb1dd93a94e
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DEBUG
        - USE_HAL_DRIVER
        - STM32F103xE
      incList:
        - Core/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - Drivers/CMSIS/Include
        - Middlewares/Third_Party/FreeRTOS-Kernel/include
        - Middlewares/Third_Party/FreeRTOS-Kernel/portable/GCC/ARM_CM3
      libList: []
    excludeList:
      - Core/Src/car_app.c
      - Core/Src/car_button.c
      - Core/Src/car_command.c
      - Core/Src/car_heading.c
      - Core/Src/car_hybrid.c
      - Core/Src/car_line.c
      - Core/Src/car_pi.c
      - Core/Src/car_power.c
      - Core/Src/car_route.c
      - Core/Src/car_task3.c
      - Core/Src/car_task3_port.c
      - Core/Src/car_task4.c
      - Core/Src/car_signal.c
      - Core/Src/car_ui.c
      - Core/Src/car_wheel.c
      - Core/Src/car_rtos.c
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: -DDEBUG
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: soft
            misc-control: []
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103RCTX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32f1x
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/debug.pyocd.yaml
        otherCmds: ""
        speed: 4M
        targetName: stm32f103rc
    uploader: pyOCD
  Release:
