      - Core/Src/car_pi.c
      - Core/Src/car_power.c
      - Core/Src/car_route.c
      - Core/Src/car_task3.c
      - Core/Src/car_task3_port.c
      - Core/Src/car_task4.c
      - Core/Src/car_signal.c
      - Core/Src/car_ui.c
      - Core/Src/car_wheel.c
      - Core/Src/car_rtos.c
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
