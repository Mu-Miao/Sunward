        - path: Core/Src/car_app.c
        - path: Core/Src/car_button.c
        - path: Core/Src/car_command.c
        - path: Core/Src/car_heading.c
        - path: Core/Src/car_hybrid.c
        - path: Core/Src/car_line.c
        - path: Core/Src/car_pi.c
        - path: Core/Src/car_power.c
        - path: Core/Src/car_route.c
        - path: Core/Src/car_task3.c
        - path: Core/Src/car_task3_port.c
        - path: Core/Src/car_task4.c
        - path: Core/Src/car_signal.c
        - path: Core/Src/car_ui.c
        - path: Core/Src/car_wheel.c
        - path: Core/Src/car_rtos.c
